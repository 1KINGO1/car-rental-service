spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    admin:
      auto-create: ${MESSAGING_ENABLED:false}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000
        max.block.ms: 5000
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
      auto-offset-reset: earliest
    listener:
      ack-mode: record
  application:
    name: booking-service
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
  sql:
    init:
      mode: always
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 100ms,500ms,1s,5s,10s
server:
  shutdown: graceful

remote-protection:
  window-size: ${REMOTE_WINDOW_SIZE:10}
  open-duration: ${REMOTE_OPEN_DURATION:10s}
  max-attempts: ${REMOTE_MAX_ATTEMPTS:3}
  initial-delay: ${REMOTE_INITIAL_DELAY:100ms}
  max-concurrent-calls: ${REMOTE_MAX_CONCURRENT_CALLS:20}

messaging:
  enabled: ${MESSAGING_ENABLED:false}
  replication-factor: ${KAFKA_REPLICATION_FACTOR:1}


logging:
  structured:
    format:
      console: logstash
    json:
      rename:
        trace_id: traceId
        span_id: spanId
