spring:
  application:
    name: booking-service
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
  sql:
    init:
      mode: always
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
server:
  shutdown: graceful

remote-protection:
  window-size: ${REMOTE_WINDOW_SIZE:10}
  open-duration: ${REMOTE_OPEN_DURATION:10s}
  max-attempts: ${REMOTE_MAX_ATTEMPTS:3}
  initial-delay: ${REMOTE_INITIAL_DELAY:100ms}
  max-concurrent-calls: ${REMOTE_MAX_CONCURRENT_CALLS:20}
