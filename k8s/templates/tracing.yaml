---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-config
data:
  config.yaml: |
{{ .Files.Get "files/tracing/datasources.yaml" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
spec:
  replicas: 1
  selector:
    matchLabels: {app: grafana}
  template:
    metadata:
      labels: {app: grafana}
    spec:
      securityContext:
        fsGroup: 10001
      containers:
        - name: grafana
          image: grafana/grafana:12.1.1
          args: []
          ports:
            - {containerPort: 3000}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: '1', memory: 512Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/grafana/provisioning/datasources/datasources.yaml, subPath: config.yaml}
            - {name: data, mountPath: /var/lib/grafana}
      volumes:
        - name: config
          configMap: {name: grafana-config}
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
spec:
  selector: {app: grafana}
  ports:
    - {name: http, port: 3000, targetPort: 3000}

{{- end }}

