global:
  resolve_timeout: 1m
route:
  receiver: team-webhook
  group_by: [alertname, namespace, app]
  group_wait: 5s
  group_interval: 10s
  repeat_interval: 1h
  routes:
    - matchers: ['severity="critical"']
      receiver: critical-webhook
receivers:
  - name: team-webhook
    webhook_configs:
      - url: http://alert-webhook:8080/alerts
        send_resolved: true
  - name: critical-webhook
    webhook_configs:
      - url: http://alert-webhook:8080/critical
        send_resolved: true
inhibit_rules:
  - source_matchers: ['alertname=~"MicroserviceDown|MicroserviceTargetMissing"', 'severity="critical"']
    target_matchers: ['severity="warning"']
    equal: [namespace, app]
