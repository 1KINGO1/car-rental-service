receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 384
    spike_limit_mib: 96
  tail_sampling:
    decision_wait: 60s
    num_traces: 20000
    expected_new_traces_per_sec: 100
    decision_cache:
      sampled_cache_size: 100000
    policies:
      - name: all-errors
        type: status_code
        status_code:
          status_codes: [ERROR]
      - name: baseline
        type: probabilistic
        probabilistic:
          sampling_percentage: 100
  transform/json_logs:
    error_mode: propagate
    log_statements:
      - context: log
        statements:
          - set(cache["message"], body)
          - set(cache["traceId"], trace_id.string)
          - set(cache["spanId"], span_id.string)
          - set(cache["service"], resource.attributes["service.name"])
          - set(body, cache)
  batch:
    send_batch_size: 256
    send_batch_max_size: 512
    timeout: 1s
exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, tail_sampling, batch]
      exporters: [otlp/tempo]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, transform/json_logs, batch]
      exporters: [otlphttp/loki]

