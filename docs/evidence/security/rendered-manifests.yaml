apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: car-rental
spec:
  ingressClassName: traefik
  rules:
    - host: car-rental.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: gateway
                port: {number: 8080}
