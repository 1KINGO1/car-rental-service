# Source: car-rental/templates/gateway.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
data:
  nginx.conf: |
    worker_processes auto;
    pid /tmp/nginx.pid;
    error_log /dev/stderr warn;
    events { worker_connections 1024; }
    http {
      access_log /dev/stdout;
      client_body_temp_path /tmp/client;
      proxy_temp_path /tmp/proxy;
      fastcgi_temp_path /tmp/fastcgi;
      uwsgi_temp_path /tmp/uwsgi;
      scgi_temp_path /tmp/scgi;
      server {
        listen 8080;
        location = /healthz { return 200 'ok'; }
        location /api/customers { proxy_pass http://customer-service:8080; }
        location /api/vehicles { proxy_pass http://fleet-service:8080; }
        location /api/bookings { proxy_pass http://booking-service:8080; }
        location /api/payments { proxy_pass http://payment-service:8080; }
        location / { return 404; }
      }
    }
