kind: Deployment
metadata:
  name: fleet-service
  namespace: car-rental-lab07
  labels:
    helm.sh/chart: car-rental-1.0.0
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: car-rental-service
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/name: fleet-service
    app.kubernetes.io/instance: car-rental
    app.kubernetes.io/component: service
    app: fleet-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fleet-service
      app.kubernetes.io/name: fleet-service
      app.kubernetes.io/instance: car-rental
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8080"
      labels:
        app: fleet-service
        app.kubernetes.io/name: fleet-service
        app.kubernetes.io/instance: car-rental
    spec:
      containers:
        - name: fleet-service
          image: car-rental/fleet-service:lab07
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: OTEL_SERVICE_NAME
              value: "fleet-service"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector:4318
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf
            - name: OTEL_TRACES_SAMPLER
              value: always_on
            - name: OTEL_PROPAGATORS
              value: tracecontext,baggage
            - name: OTEL_METRICS_EXPORTER
              value: none
            - name: OTEL_LOGS_EXPORTER
              value: otlp
            - name: SPRING_PROFILES_ACTIVE
              value: "default"
            - name: SERVER_PORT
              value: "8080"
            - name: DB_URL
              valueFrom:
                configMapKeyRef:
                  name: fleet-config
                  key: DB_URL
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: fleet-config
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fleet-db-secret
                  key: DB_PASSWORD
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 40
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            limits:
              cpu: 1000m
              memory: 768Mi
            requests:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
