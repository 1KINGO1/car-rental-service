# Source: car-rental/templates/database.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: booking-db
  namespace: car-rental-lab07
  labels:
    helm.sh/chart: car-rental-1.0.0
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: car-rental-service
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/name: booking-db
    app.kubernetes.io/instance: car-rental
    app.kubernetes.io/component: database
    app: booking-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: booking-db
      app.kubernetes.io/name: booking-db
      app.kubernetes.io/instance: car-rental
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: booking-db
        app.kubernetes.io/name: booking-db
        app.kubernetes.io/instance: car-rental
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: booking-config
                  key: DB_NAME
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: booking-config
                  key: DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: booking-db-secret
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: booking-db-pvc
