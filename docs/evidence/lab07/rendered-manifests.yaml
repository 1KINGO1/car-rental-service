# Source: car-rental/templates/tracing.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 384
        spike_limit_mib: 96
      tail_sampling:
        decision_wait: 60s
        num_traces: 20000
        expected_new_traces_per_sec: 100
        decision_cache:
          sampled_cache_size: 100000
        policies:
          - name: all-errors
            type: status_code
            status_code:
              status_codes: [ERROR]
          - name: baseline
            type: probabilistic
            probabilistic:
              sampling_percentage: 100
      transform/json_logs:
        error_mode: propagate
        log_statements:
          - context: log
            statements:
              - set(cache["message"], body)
              - set(cache["traceId"], trace_id.string)
              - set(cache["spanId"], span_id.string)
              - set(cache["service"], resource.attributes["service.name"])
              - set(body, cache)
      batch:
        send_batch_size: 256
        send_batch_max_size: 512
        timeout: 1s
    exporters:
      otlp/tempo:
        endpoint: tempo:4317
        tls:
          insecure: true
      otlphttp/loki:
        endpoint: http://loki:3100/otlp
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, tail_sampling, batch]
          exporters: [otlp/tempo]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, transform/json_logs, batch]
          exporters: [otlphttp/loki]
---
# Source: car-rental/templates/tracing.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: tempo-config
data:
  config.yaml: |
    server:
      http_listen_port: 3200
    distributor:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318
    storage:
      trace:
        backend: local
        wal:
          path: /var/tempo/wal
        local:
          path: /var/tempo/blocks
    compactor:
      compaction:
        block_retention: 24h
---
# Source: car-rental/templates/tracing.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
data:
  config.yaml: |
    auth_enabled: false
    server:
      http_listen_port: 3100
    common:
      path_prefix: /var/loki
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory
      storage:
        filesystem:
          chunks_directory: /var/loki/chunks
          rules_directory: /var/loki/rules
    schema_config:
      configs:
        - from: 2024-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
    limits_config:
      allow_structured_metadata: true
---
# Source: car-rental/templates/tracing.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-config
data:
  config.yaml: |
    apiVersion: 1
    datasources:
      - name: Tempo
        uid: tempo
        type: tempo
        access: proxy
        url: http://tempo:3200
        jsonData:
          tracesToLogsV2:
            datasourceUid: loki
            spanStartTimeShift: '-5m'
            spanEndTimeShift: '5m'
            tags:
              - key: service.name
                value: service_name
            customQuery: true
            query: '{$${__tags}} | trace_id = "$${__trace.traceId}"'
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki:3100
