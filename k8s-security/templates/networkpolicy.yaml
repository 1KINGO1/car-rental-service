apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-from-ingress-and-booking
spec:
  podSelector:
    matchLabels: {app: gateway}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.ingress.controllerNamespace }}
          podSelector:
            matchLabels:
              app: {{ .Values.ingress.controllerApp }}
        - podSelector:
            matchLabels: {app: booking-service}
      ports:
        - {protocol: TCP, port: 8080}
{{- range $name, $svc := .Values.services }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}-from-gateway
spec:
  podSelector:
    matchLabels: {app: {{ $name }}-service}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: gateway}
      ports:
        - {protocol: TCP, port: {{ $.Values.app.port }}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}-db-from-owner
spec:
  podSelector:
    matchLabels: {app: {{ $name }}-db}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: {{ $name }}-service}
      ports:
        - {protocol: TCP, port: {{ $.Values.postgres.port }}}
{{- end }}
